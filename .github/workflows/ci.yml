name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build CLI distribution
        run: ./gradlew check :compiler:installDist :compiler:distZip --console=plain

      - name: Smoke-test mochypck CLI
        run: |
          ./compiler/build/install/mochypck/bin/mochypck --help
          ./compiler/build/install/mochypck/bin/mochypck init /tmp/smoke-pack
          test -f /tmp/smoke-pack/pack.json

      - name: Upload mochypck CLI archive
        uses: actions/upload-artifact@v4
        with:
          name: mochypck-cli
          path: compiler/build/distributions/mochypck-*.zip
